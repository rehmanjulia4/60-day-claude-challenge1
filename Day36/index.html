:root{
  --navy-deep:#04080f;
  --navy:#060d1a;
  --teal:#0fd4be;
  --gold:#c9a84c;
  --amber:#e2833f;
  --ink:#eaf2f4;
  --ink-dim:#9fb3bb;
  --card:#0b1526;
  --card-border:rgba(15,212,190,0.18);
  --accent:var(--teal);
  --accent-soft:rgba(15,212,190,0.14);
  --radius:18px;
  --transition:280ms cubic-bezier(.4,0,.2,1);
}
[data-mode="stress"]{
  --accent:var(--amber);
  --accent-soft:rgba(226,131,63,0.16);
  --navy:#0a0808;
  --navy-deep:#050403;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(circle at 20% -10%, var(--accent-soft), transparent 45%),
             linear-gradient(180deg, var(--navy-deep), var(--navy) 60%);
  color:var(--ink);
  min-height:100vh;
  transition:background var(--transition);
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;margin:0 0 .4em;letter-spacing:.01em;}
p{line-height:1.55;}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  max-width:760px;margin:0 auto;padding:16px 20px 0;
}
.brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.15rem;color:var(--ink);}
.brand span{color:var(--accent);}
.badge{
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--card-border);
  padding:5px 10px;border-radius:999px;font-weight:700;
}
.progress-track{
  height:6px;border-radius:999px;background:rgba(255,255,255,0.07);
  max-width:760px;margin:18px auto 0;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));
  transition:width 420ms ease;
}
.progress-label{
  max-width:760px;margin:8px auto 0;padding:0 20px;
  font-size:.72rem;color:var(--ink-dim);letter-spacing:.05em;text-transform:uppercase;
}
.screen{animation:fadeUp 420ms ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:18px;
}
.pill-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}
.pill{
  font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--card-border);padding:6px 12px;border-radius:999px;
}
.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;}
@media (max-width:520px){.mode-select{grid-template-columns:1fr;}}
.mode-card{
  background:var(--card);border:1.5px solid var(--card-border);border-radius:var(--radius);
  padding:22px 18px;text-align:left;cursor:pointer;color:var(--ink);
  transition:transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  font-family:'DM Sans',sans-serif;
}
.mode-card:hover,.mode-card:focus-visible{
  transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 12px 30px -14px var(--accent);outline:none;
}
.mode-card h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin-bottom:6px;}
.mode-card .icon{font-size:1.8rem;margin-bottom:10px;display:block;}
.mode-card small{color:var(--ink-dim);font-size:.82rem;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  color:#04080f;font-weight:700;border:none;border-radius:12px;
  padding:14px 26px;font-size:.95rem;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:transform var(--transition), box-shadow var(--transition);
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--accent);outline:none;}
.btn.secondary{
  background:transparent;color:var(--ink);border:1.5px solid var(--card-border);
}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.scenario-num{
  color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
}
.option-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.option-btn{
  text-align:left;background:rgba(255,255,255,0.02);border:1.5px solid var(--card-border);
  border-radius:12px;padding:14px 16px;color:var(--ink);font-family:'DM Sans',sans-serif;
  font-size:.92rem;cursor:pointer;transition:border-color var(--transition), background var(--transition), transform 160ms ease;
}
.option-btn:hover,.option-btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none;}
.option-btn.chosen{border-color:var(--accent);background:var(--accent-soft);transform:scale(0.99);}
.drag-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
.drag-item{
  background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:grab;
  transition:border-color var(--transition), transform 160ms ease, opacity 160ms ease;
  touch-action:none;
}
.drag-item.dragging{opacity:.4;}
.drag-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.drag-item .rank{
  width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0;
}
.drag-item .handle{color:var(--ink-dim);font-size:1rem;margin-left:auto;display:flex;gap:4px;}
.reorder-btn{
  background:none;border:1px solid var(--card-border);color:var(--ink-dim);border-radius:6px;
  width:26px;height:26px;cursor:pointer;font-size:.8rem;line-height:1;
}
.reorder-btn:hover,.reorder-btn:focus-visible{color:var(--accent);border-color:var(--accent);outline:none;}
.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;}
.journal-header{text-align:center;margin-bottom:8px;}
.style-bar-row{margin-bottom:14px;}
.style-bar-label{
  display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px;color:var(--ink-dim);
}
.style-bar-label strong{color:var(--ink);}
.style-bar-track{height:12px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;}
.style-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));width:0%;transition:width 900ms cubic-bezier(.16,1,.3,1);}
.insight-box{
  background:var(--accent-soft);border:1px solid var(--card-border);border-radius:14px;padding:18px 20px;margin:16px 0;
}
.insight-box h3{font-size:1.2rem;color:var(--accent);}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.tag{background:rgba(255,255,255,0.05);border:1px solid var(--card-border);color:var(--ink-dim);
  font-size:.7rem;padding:4px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
@media (max-width:520px){.compare-grid{grid-template-columns:1fr;}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.footer-note{text-align:center;color:var(--ink-dim);font-size:.72rem;margin-top:30px;letter-spacing:.03em;}
.disclaimer{
  font-size:.76rem;color:var(--ink-dim);border-top:1px solid var(--card-border);padding-top:14px;margin-top:16px;
}
.chip-toggle{display:flex;gap:8px;margin-bottom:10px;}
.chip-toggle button{
  background:transparent;border:1px solid var(--card-border);color:var(--ink-dim);
  padding:6px 14px;border-radius:999px;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.chip-toggle button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.svg-radar{display:block;margin:0 auto;}
.instructions-note{font-size:.78rem;color:var(--ink-dim);margin-top:10px;}
.kbd{
  display:inline-block;border:1px solid var(--card-border);border-radius:5px;padding:1px 6px;
  font-size:.7rem;background:rgba(255,255,255,0.04);
}
</style>
</head>

];

};

if(isDemo){
  state.chosenOptions = {supply:"analytical", aiflag:"action", budget:"balanced", regulator:"action", safety:"intuitive", staffing:"action"};

}

function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs){ Object.keys(attrs).forEach(function(k){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });}
  (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function announce(msg){ var lr = $("#liveRegion"); if(lr) lr.textContent = msg; }

var CHAPTER_WEIGHTS = { chapter1:1, chapter2:{5:5,4:4,3:3,2:2,1:1}, chapter3:{5:5,4:4,3:3,2:2,1:1} };

function computeRankScores(order, list){
  var pts = {};
  order.forEach(function(id, idx){
    var item = list.filter(function(x){return x.id===id;})[0];
    var rank = idx+1; // 1 = top
    var weight = list.length - idx; // top gets highest
    pts[item.style] = (pts[item.style]||0) + weight;
  });
  return pts;
}

function totalScores(){
  var total = {analytical:0, intuitive:0, overthink:0, action:0, balanced:0};
  Object.keys(state.scores).forEach(function(k){ total[k]+= state.scores[k]; });
  var p2 = computeRankScores(state.priorityOrder, PRIORITY_CARDS);
  var p3 = computeRankScores(state.timelineOrder, TIMELINE_STEPS);
  Object.keys(p2).forEach(function(k){ total[k]+=p2[k]; });
  Object.keys(p3).forEach(function(k){ total[k]+=p3[k]; });
  return total;
}

function percentages(total){
  var sum = Object.keys(total).reduce(function(a,k){return a+total[k];},0) || 1;
  var pct = {};
  Object.keys(total).forEach(function(k){ pct[k] = Math.round((total[k]/sum)*1000)/10; });
  return pct;
}

function setMode(mode){
  state.mode = mode;
  document.body.setAttribute("data-mode", mode);
  $("#modeBadge").textContent = mode === "calm" ? "Calm Mode" : "Stress Mode";
}

function updateProgress(){
  var map = {start:0, chapter1:20, chapter2:50, chapter3:75, journal:100};
  var labels = {start:"Start", chapter1:"Chapter 1 · Thinking Style", chapter2:"Chapter 2 · Priorities", chapter3:"Chapter 3 · Timeline", journal:"Reflection Journal"};
  var pct = map[state.screen] !== undefined ? map[state.screen] : 0;
  if(state.screen === "chapter1"){
    pct = 5 + Math.round((state.scenarioIndex/SCENARIOS.length)*40);
  }
  $("#progressFill").style.width = pct + "%";
  $("#progressLabel").textContent = labels[state.screen] || "";
}

function go(screen){
  state.screen = screen;
  render();
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

// ---------- SCREEN: START ----------

  });

    el("span",{class:"icon","aria-hidden":"true"},[document.createTextNode("\u25CB")]),
    el("h3",{},[document.createTextNode("Calm Mode")]),

  ]);

// ---------- SCREEN: CHAPTER 1 ----------
function renderChapter1(container){
  var idx = state.scenarioIndex;
  var scenario = SCENARIOS[idx];
  var card = el("div",{class:"card screen"});
  card.appendChild(el("div",{class:"scenario-num"},[document.createTextNode("Chapter 1 \u00B7 Scenario "+(idx+1)+" of "+SCENARIOS.length)]));
  card.appendChild(el("h2",{},[document.createTextNode(scenario[state.mode])]));
  card.appendChild(el("p",{class:"instructions-note"},[document.createTextNode("Choose the response that feels most natural to you, not the one you think is correct.")]));

  var list = el("div",{class:"option-list"}, scenario.options.map(function(opt){
    var chosen = state.chosenOptions[scenario.id] === opt.style;
    return el("button",{
      class:"option-btn"+(chosen?" chosen":""),
      onclick:function(){ selectOption(scenario, opt.style); }
    },[document.createTextNode(opt.text)]);
  }));
  card.appendChild(list);
  container.appendChild(card);
}

function selectOption(scenario, style){
  var prev = state.chosenOptions[scenario.id];
  if(prev) state.scores[prev] -= 1;
  state.chosenOptions[scenario.id] = style;
  state.scores[style] += 1;
  announce("Response recorded.");
  setTimeout(function(){
    if(state.scenarioIndex < SCENARIOS.length - 1){
      state.scenarioIndex += 1;
      render(); updateProgress(); window.scrollTo({top:0,behavior:"smooth"});
    } else {
      go("chapter2");
    }
  }, 260);
}

// ---------- SCREEN: CHAPTER 2 (priorities drag) ----------
function renderRankList(container, order, list, onchange, idPrefix){
  var ul = el("ul",{class:"drag-list", role:"listbox", "aria-label":"Reorderable priority list"});
  order.forEach(function(id, idx){
    var item = list.filter(function(x){return x.id===id;})[0];
    var li = el("li",{
      class:"drag-item", draggable:"true", tabindex:"0",
      role:"option", "aria-label": item.label + ", position " + (idx+1) + " of " + order.length,
      id: idPrefix+"-"+id,
      "data-id": id
    });
    li.appendChild(el("span",{class:"rank"},[document.createTextNode(String(idx+1))]));
    var textWrap = el("div",{});
    textWrap.appendChild(el("div",{style:"font-weight:600;"},[document.createTextNode(item.label)]));
    textWrap.appendChild(el("div",{style:"font-size:.78rem;color:var(--ink-dim);"},[document.createTextNode(item.desc)]));
    li.appendChild(textWrap);
    var handle = el("span",{class:"handle"});
    var up = el("button",{class:"reorder-btn","aria-label":"Move "+item.label+" up", onclick:function(e){ e.stopPropagation(); moveItem(order, idx, -1, onchange); }},[document.createTextNode("\u2191")]);
    var down = el("button",{class:"reorder-btn","aria-label":"Move "+item.label+" down", onclick:function(e){ e.stopPropagation(); moveItem(order, idx, 1, onchange); }},[document.createTextNode("\u2193")]);
    handle.appendChild(up); handle.appendChild(down);
    li.appendChild(handle);

    li.addEventListener("dragstart", function(e){ li.classList.add("dragging"); e.dataTransfer.setData("text/plain", id); });
    li.addEventListener("dragend", function(){ li.classList.remove("dragging"); });
    li.addEventListener("dragover", function(e){ e.preventDefault(); });
    li.addEventListener("drop", function(e){
      e.preventDefault();
      var draggedId = e.dataTransfer.getData("text/plain");
      reorderById(order, draggedId, id, onchange);
    });
    li.addEventListener("keydown", function(e){
      if(e.key === "ArrowUp"){ e.preventDefault(); moveItem(order, idx, -1, onchange); li.focus(); }
      if(e.key === "ArrowDown"){ e.preventDefault(); moveItem(order, idx, 1, onchange); li.focus(); }
    });
    ul.appendChild(li);
  });
  container.appendChild(ul);
  container.appendChild(el("p",{class:"instructions-note"},[document.createTextNode("Drag to reorder, or focus an item and use the arrow buttons or "), el("span",{class:"kbd"},[document.createTextNode("\u2191")]), document.createTextNode(" / "), el("span",{class:"kbd"},[document.createTextNode("\u2193")]), document.createTextNode(" keys.")]));
}

function moveItem(order, idx, dir, onchange){
  var newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= order.length) return;
  var tmp = order[idx]; order[idx] = order[newIdx]; order[newIdx] = tmp;
  onchange();
}
function reorderById(order, draggedId, targetId, onchange){
  if(draggedId === targetId) return;
  var from = order.indexOf(draggedId);
  var to = order.indexOf(targetId);
  if(from < 0 || to < 0) return;
  order.splice(from,1);
  order.splice(to,0,draggedId);
  onchange();
}

function renderChapter2(container){

// ---------- SCREEN: JOURNAL ----------
function topStyles(pct){
  return STYLE_ORDER.slice().sort(function(a,b){ return pct[b]-pct[a]; });
}

function drawRadar(svgHolder, pct){
  var size = 260, cx = size/2, cy = size/2, r = 95;
  var n = STYLE_ORDER.length;
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox","0 0 "+size+" "+size);
  svg.setAttribute("class","svg-radar");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Radar chart of thinking style percentages");

  for(var ring=1; ring<=4; ring++){
    var rr = r*(ring/4);
    var pts = [];
    for(var i=0;i<n;i++){
      var ang = (Math.PI*2*i/n) - Math.PI/2;
      pts.push((cx+rr*Math.cos(ang)) + "," + (cy+rr*Math.sin(ang)));
    }
    var poly = document.createElementNS(ns,"polygon");
    poly.setAttribute("points", pts.join(" "));
    poly.setAttribute("fill","none");
    poly.setAttribute("stroke","rgba(255,255,255,0.08)");
    svg.appendChild(poly);
  }

  var dataPts = [];
  STYLE_ORDER.forEach(function(k,i){
    var val = Math.max(pct[k],2)/100 * r; // scale vs 100% for visibility, floor for tiny values
    var ang = (Math.PI*2*i/n) - Math.PI/2;
    dataPts.push((cx+val*Math.cos(ang)) + "," + (cy+val*Math.sin(ang)));
  });
  var dpoly = document.createElementNS(ns,"polygon");
  dpoly.setAttribute("points", dataPts.join(" "));
  dpoly.setAttribute("fill","rgba(15,212,190,0.28)");
  dpoly.setAttribute("stroke","#0fd4be");
  dpoly.setAttribute("stroke-width","2");
  svg.appendChild(dpoly);

  STYLE_ORDER.forEach(function(k,i){
    var ang = (Math.PI*2*i/n) - Math.PI/2;
    var lx = cx + (r+22)*Math.cos(ang);
    var ly = cy + (r+22)*Math.sin(ang);
    var t = document.createElementNS(ns,"text");
    t.setAttribute("x", lx); t.setAttribute("y", ly);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size","9.5");
    t.setAttribute("fill","#9fb3bb");
    t.setAttribute("font-family","DM Sans, sans-serif");
    t.textContent = STYLES[k].short;
    svg.appendChild(t);
  });

  svgHolder.appendChild(svg);
}

function renderJournal(container){
  var res = state.results[state.mode];
  var pct = res.pct;
  var order = topStyles(pct);
  var top = order[0], second = order[1];

  var card = el("div",{class:"card screen"});
  card.appendChild(el("div",{class:"journal-header"},[
    el("div",{class:"scenario-num"},[document.createTextNode("Reflection Journal \u00B7 "+(state.mode==="calm"?"Calm Mode":"Stress Mode"))]),
    el("h2",{},[document.createTextNode("Your Thinking Pattern Snapshot")])
  ]));

  var radarHolder = el("div",{});
  drawRadar(radarHolder, pct);
  card.appendChild(radarHolder);

  var bars = el("div",{style:"margin-top:20px;"});
  order.forEach(function(k){
    var row = el("div",{class:"style-bar-row"});
    row.appendChild(el("div",{class:"style-bar-label"},[
      el("span",{},[document.createTextNode(STYLES[k].name)]),
      el("strong",{},[document.createTextNode(pct[k]+"%")])
    ]));
    var track = el("div",{class:"style-bar-track"});
    var fill = el("div",{class:"style-bar-fill"});
    track.appendChild(fill);
    row.appendChild(track);
    bars.appendChild(row);
  });
  card.appendChild(bars);

  var insight = el("div",{class:"insight-box"});
  insight.appendChild(el("h3",{},[document.createTextNode("Your leading tendency: "+STYLES[top].name)]));
  insight.appendChild(el("p",{},[document.createTextNode(STYLES[top].desc)]));
  insight.appendChild(el("p",{},[document.createTextNode("Your secondary tendency, "+STYLES[second].name+", suggests you also draw on this when the primary approach is not enough on its own.")]));
  var tagRow = el("div",{class:"tag-row"});
  tagRow.appendChild(el("span",{class:"tag"},[document.createTextNode(state.mode==="calm"?"Observed under routine conditions":"Observed under time pressure")]));
  tagRow.appendChild(el("span",{class:"tag"},[document.createTextNode("Reflective, not diagnostic")]));
  insight.appendChild(tagRow);
  card.appendChild(insight);

  if(state.results.calm && state.results.stress){
    var cTop = topStyles(state.results.calm.pct)[0];
    var sTop = topStyles(state.results.stress.pct)[0];
    var compareCard = el("div",{class:"insight-box"});
    compareCard.appendChild(el("h3",{},[document.createTextNode("Calm vs. Stress Comparison")]));
    if(cTop === sTop){
      compareCard.appendChild(el("p",{},[document.createTextNode("Your leading tendency, "+STYLES[cTop].name+", stayed consistent across both calm and high-pressure conditions, suggesting a stable core approach.")]));
    } else {
      compareCard.appendChild(el("p",{},[document.createTextNode("Under calm conditions your leading tendency was "+STYLES[cTop].name+". Under stress, it shifted toward "+STYLES[sTop].name+", suggesting pressure changes how you approach decisions.")]));
    }
    var grid = el("div",{class:"compare-grid"});
    ["calm","stress"].forEach(function(m){
      var mres = state.results[m];
      var mtop = topStyles(mres.pct)[0];
      var box = el("div",{style:"border:1px solid var(--card-border);border-radius:12px;padding:14px;"});
      box.appendChild(el("div",{class:"pill"},[document.createTextNode(m==="calm"?"Calm Mode":"Stress Mode")]));
      box.appendChild(el("h3",{style:"font-size:1.1rem;margin-top:8px;"},[document.createTextNode(STYLES[mtop].short)]));
      box.appendChild(el("div",{style:"font-size:.8rem;color:var(--ink-dim);"},[document.createTextNode(mres.pct[mtop]+"% of responses")]));
      grid.appendChild(box);
    });
    compareCard.appendChild(grid);
    card.appendChild(compareCard);
  }

  var nav = el("div",{class:"chapter-nav"});
  nav.appendChild(el("button",{class:"btn secondary", onclick:function(){ resetForReplay(); }},[document.createTextNode("Replay in "+(state.mode==="calm"?"Stress":"Calm")+" Mode")]));
  nav.appendChild(el("button",{class:"btn secondary", onclick:function(){ resetSameMode(); }},[document.createTextNode("Restart")]));
  card.appendChild(nav);

  card.appendChild(el("div",{class:"disclaimer"},[document.createTextNode("This Reflection Journal is a self-exploration exercise built for the HealthNexus 60-Day Claude Challenge. It does not diagnose, assess, or predict clinical or professional performance.")]));

  container.appendChild(card);

  requestAnimationFrame(function(){
    var fills = card.querySelectorAll(".style-bar-fill");
    order.forEach(function(k, i){ fills[i].style.width = pct[k]+"%"; });
  });
}

function resetForReplay(){
  var nextMode = state.mode === "calm" ? "stress" : "calm";
  state.scenarioIndex = 0;
  state.chosenOptions = {};
  state.scores = {analytical:0, intuitive:0, overthink:0, action:0, balanced:0};
  state.priorityOrder = PRIORITY_CARDS.map(function(c){return c.id;});
  state.timelineOrder = TIMELINE_STEPS.map(function(c){return c.id;});
  setMode(nextMode);
  go("chapter1");
}
function resetSameMode(){
  state.scenarioIndex = 0;
  state.chosenOptions = {};
  state.scores = {analytical:0, intuitive:0, overthink:0, action:0, balanced:0};
  state.priorityOrder = PRIORITY_CARDS.map(function(c){return c.id;});
  state.timelineOrder = TIMELINE_STEPS.map(function(c){return c.id;});
  go("chapter1");
}

function render(){
  var app = $("#app");
  app.innerHTML = "";
  if(state.screen === "start") renderStart(app);
  else if(state.screen === "chapter1") renderChapter1(app);
  else if(state.screen === "chapter2") renderChapter2(app);
  else if(state.screen === "chapter3") renderChapter3(app);
  else if(state.screen === "journal") renderJournal(app);
}

setMode(state.mode);
if(isDemo){
  state.results.calm = (function(){ var t = totalScores(); return {total:t, pct:percentages(t)}; })();
  go("journal");
}
else { render(); updateProgress(); }

})();
</script>
