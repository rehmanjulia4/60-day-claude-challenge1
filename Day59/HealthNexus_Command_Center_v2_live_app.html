:root {
  --navy-bg: #04080f;
  --navy-bg2: #060d1a;
  --navy-card: #0d1826;
  --navy-card2: #0f1e2e;
  --navy-border: #1c2c40;
  --teal: #0fd4be;
  --teal-dark: #0a8a78;
  --gold: #c9a84c;
  --white: #ffffff;
  --ink: #0b1220;
  --grey: #5b6472;
  --grey-light: #9fa8b3;
  --danger: #ff6b6b;
  --warn: #e0a83c;
  --ok: #35c98e;
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'DM Sans', sans-serif;
  --font-arabic: 'Noto Sans Arabic', sans-serif;
  --accent: var(--teal);
  --accent-dark: var(--teal-dark);
}

[data-theme="teal"] {
  --accent: #0fd4be;
  --accent-dark: #0a8a78;
}
[data-theme="gold"] {
  --accent: #c9a84c;
  --accent-dark: #9c8038;
}
[data-theme="navy"] {
  --accent: #4c8ec9;
  --accent-dark: #2f6699;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at top, var(--navy-bg2) 0%, var(--navy-bg) 60%);
  color: #dbe4ee;
  font-family: var(--font-body);
  overflow-x: hidden;
  min-height: 100vh;
}
body[dir="rtl"] { font-family: var(--font-arabic); }
body[dir="rtl"] .display { font-family: var(--font-arabic); }

.display { font-family: var(--font-display); }

#root { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- Header ---------- */
.hn-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--navy-border);
  background: rgba(6, 13, 26, 0.85);
  position: sticky;
  top: 0;
  z-index: 50;
  flex-wrap: wrap;
  gap: 10px;
}
.hn-brand { display: flex; align-items: center; gap: 10px; }
.hn-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 15px;
  flex-shrink: 0;
}
.hn-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: #fff; }
.hn-subtitle { font-size: 11px; color: var(--grey-light); letter-spacing: 0.5px; }

.hn-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hn-pill {
  display: flex; border: 1px solid var(--navy-border); border-radius: 999px; overflow: hidden;
  background: var(--navy-card);
}
.hn-pill button {
  border: none; background: transparent; color: var(--grey-light);
  padding: 7px 13px; font-size: 12px; font-family: var(--font-body); cursor: pointer;
  transition: all 0.15s;
}
.hn-pill button.active { background: var(--accent); color: var(--ink); font-weight: 700; }
.hn-pill button:hover:not(.active) { color: #fff; }

/* ---------- Nav Tabs ---------- */
.hn-nav {
  display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--navy-border);
  background: rgba(4, 8, 15, 0.6); flex-wrap: wrap;
}
.hn-tab {
  padding: 9px 16px; border-radius: 9px; border: 1px solid transparent;
  background: transparent; color: var(--grey-light); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: var(--font-body); display: flex; align-items: center; gap: 6px;
}
.hn-tab.active { background: var(--navy-card2); border-color: var(--accent); color: #fff; }
.hn-tab:hover:not(.active) { color: #fff; }
.hn-tab .badge {
  background: var(--accent); color: var(--ink); border-radius: 999px; font-size: 10px;
  padding: 1px 7px; font-weight: 700;
}

/* ---------- Main content ---------- */
.hn-main { flex: 1; padding: 28px 24px 60px; max-width: 1180px; margin: 0 auto; width: 100%; }
.hn-section-title {
  font-family: var(--font-display); font-size: 30px; font-weight: 700; color: #fff; margin: 0 0 6px;
}
.hn-section-kicker {
  font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 700; text-transform: uppercase;
  margin-bottom: 8px;
}
.hn-section-sub { color: var(--grey-light); font-size: 14.5px; line-height: 1.6; margin-bottom: 26px; max-width: 780px; }

.hn-card {
  background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 14px;
  padding: 20px 22px; margin-bottom: 16px;
}
.hn-card h3 { font-family: var(--font-display); font-size: 19px; color: #fff; margin: 0 0 8px; }
.hn-card p { font-size: 13.5px; color: #b9c3d0; line-height: 1.6; margin: 0 0 6px; }

.hn-badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase;
}
.hn-badge.exceptional { background: rgba(53,201,142,0.15); color: var(--ok); border: 1px solid rgba(53,201,142,0.4); }
.hn-badge.strong { background: rgba(15,212,190,0.15); color: var(--teal); border: 1px solid rgba(15,212,190,0.4); }
.hn-badge.moderate { background: rgba(224,168,60,0.15); color: var(--warn); border: 1px solid rgba(224,168,60,0.4); }
.hn-badge.elevated { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.4); }
.hn-badge.highrisk { background: rgba(255,107,107,0.15); color: var(--danger); border: 1px solid rgba(255,107,107,0.4); }

/* ---------- Interview ---------- */
.hn-qa { display: flex; flex-direction: column; gap: 14px; }
.hn-qrow { display: flex; gap: 14px; align-items: flex-start; }
.hn-qnum {
  min-width: 30px; height: 30px; border-radius: 999px; background: var(--accent); color: var(--ink);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.hn-q { font-weight: 700; color: #fff; font-size: 14.5px; margin-bottom: 4px; }
.hn-a {
  display: inline-block; background: var(--accent-dark); color: #fff; padding: 4px 12px; border-radius: 8px;
  font-size: 13px; font-weight: 700;
}
.hn-why { color: var(--grey-light); font-size: 12.5px; margin-top: 6px; font-style: italic; }

/* ---------- Blueprint days ---------- */
.hn-day {
  background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 14px; margin-bottom: 12px;
  overflow: hidden;
}
.hn-day-head {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer;
}
.hn-day-num {
  font-family: var(--font-display); font-size: 22px; color: var(--accent); font-weight: 700; min-width: 70px;
}
.hn-day-title { font-weight: 700; color: #fff; font-size: 15px; flex: 1; }
.hn-day-chevron { color: var(--grey-light); transition: transform 0.2s; }
.hn-day.open .hn-day-chevron { transform: rotate(180deg); }
.hn-day-body { padding: 0 20px 20px; border-top: 1px solid var(--navy-border); }
.hn-day-body h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); margin: 14px 0 6px; }
.hn-day-body ul { margin: 0; padding-inline-start: 20px; }
.hn-day-body li { font-size: 13px; color: #b9c3d0; margin-bottom: 4px; line-height: 1.5; }

/* ---------- Pitch deck ---------- */
.hn-deck-wrap { display: flex; flex-direction: column; align-items: center; }
.hn-slide {
  width: 100%; max-width: 900px; aspect-ratio: 16/9; background: var(--navy-card2);
  border: 1px solid var(--navy-border); border-radius: 16px; padding: 40px 46px;
  display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden;
}
.hn-slide-kicker { font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
.hn-slide-title { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 14px; }
.hn-slide-body { font-size: 13.5px; color: #b9c3d0; line-height: 1.6; max-width: 560px; }
.hn-slide-num { position: absolute; bottom: 18px; inset-inline-end: 22px; font-size: 11px; color: var(--grey); }
.hn-deck-nav { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
.hn-deck-nav button {
  background: var(--navy-card); border: 1px solid var(--navy-border); color: #fff; border-radius: 10px;
  padding: 8px 16px; cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: 13px;
}
.hn-deck-nav button:disabled { opacity: 0.35; cursor: default; }
.hn-deck-dots { display: flex; gap: 6px; }
.hn-deck-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--navy-border); cursor: pointer; }
.hn-deck-dot.active { background: var(--accent); }

/* ---------- Governance disclosure banner ---------- */
.hn-disclosure {
  background: rgba(224,168,60,0.08); border: 1px solid rgba(224,168,60,0.35); border-radius: 10px;
  padding: 10px 16px; font-size: 12px; color: var(--warn); margin-bottom: 20px; display: flex; gap: 8px; align-items: flex-start;
}

/* ---------- Footer ---------- */
.hn-footer { text-align: center; padding: 18px; color: var(--grey); font-size: 11px; border-top: 1px solid var(--navy-border); }

/* ---------- Incident Queue (Day 54) ---------- */
.hn-summary-strip {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 14px;
  padding: 18px 24px; margin-bottom: 18px;
}
.hn-summary-total { display: flex; flex-direction: column; align-items: flex-start; padding-inline-end: 24px; border-inline-end: 1px solid var(--navy-border); }
.hn-summary-total-num { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: #fff; line-height: 1; }
.hn-summary-total-label { font-size: 11.5px; color: var(--grey-light); margin-top: 4px; }
.hn-summary-tiers { display: flex; gap: 18px; flex-wrap: wrap; }
.hn-summary-tier { display: flex; align-items: center; gap: 8px; }
.hn-summary-tier-count { font-weight: 700; color: #fff; font-size: 14px; }

.hn-facility-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.hn-facility-chip {
  border: 1px solid var(--navy-border); background: var(--navy-card); color: var(--grey-light);
  padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-family: var(--font-body); font-weight: 700; cursor: pointer;
}
.hn-facility-chip.active { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.hn-facility-chip:hover:not(.active) { color: #fff; }

.hn-queue-list { display: flex; flex-direction: column; gap: 12px; }
.hn-incident-card {
  background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 12px;
  padding: 16px 20px; cursor: pointer; transition: border-color 0.15s;
}
.hn-incident-card:hover { border-color: var(--accent); }
.hn-incident-card-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.hn-incident-meta { font-size: 12.5px; color: var(--grey-light); font-weight: 700; }
.hn-incident-time { font-size: 11.5px; color: var(--grey); margin-inline-start: auto; }
.hn-incident-narrative { font-size: 14px; color: #dbe4ee; margin-bottom: 4px; line-height: 1.5; }
.hn-incident-trend { font-size: 12px; color: var(--grey-light); font-style: italic; }
.hn-detail-stub-note {
  text-align: center; color: var(--grey); font-size: 12.5px; margin-top: 18px;
  border: 1px dashed var(--navy-border); border-radius: 10px; padding: 12px;
}

@media (max-width: 700px) {
  .hn-summary-strip { flex-direction: column; align-items: flex-start; gap: 14px; }
  .hn-summary-total { border-inline-end: none; padding-inline-end: 0; }
  .hn-incident-time { margin-inline-start: 0; }
}

/* ---------- Facility Compare + Incident Detail (Day 55) ---------- */
.hn-compare-strip { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 4px; }
.hn-compare-card {
  min-width: 190px; background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 12px;
  padding: 14px 16px; cursor: pointer; flex-shrink: 0;
}
.hn-compare-card.active { border-color: var(--accent); }
.hn-compare-card:hover { border-color: var(--accent); }
.hn-compare-name { font-size: 12px; font-weight: 700; color: var(--grey-light); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hn-compare-count { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: #fff; line-height: 1; }
.hn-compare-label { font-size: 10.5px; color: var(--grey); margin-bottom: 8px; }

.hn-detail { max-width: 760px; margin: 0 auto; }
.hn-detail-back {
  background: none; border: none; color: var(--accent); font-family: var(--font-body); font-weight: 700;
  font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 20px;
}
.hn-detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
.hn-detail-title { font-size: 26px; color: #fff; margin: 0; }
.hn-detail-meta { font-size: 13px; color: var(--grey-light); margin-bottom: 22px; }
.hn-detail-card {
  background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 14px;
}
.hn-detail-card h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); margin: 0 0 8px; }
.hn-detail-card p { font-size: 14.5px; color: #dbe4ee; line-height: 1.6; margin: 0; }
.hn-detail-trend p { font-style: italic; color: var(--grey-light); }
.hn-detail-facility-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.hn-detail-stat-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent); }
.hn-detail-stat-label { font-size: 11px; color: var(--grey-light); }

@media (max-width: 700px) {
  .hn-compare-card { min-width: 150px; }
  .hn-detail-facility-stats { gap: 18px; }
}

/* ---------- Recommendation, Sign-Off, Resolved (Day 56) ---------- */
.hn-rec-panel {
  background: rgba(15,212,190,0.06); border: 1.5px dashed var(--accent); border-radius: 12px;
  padding: 18px 20px; margin: 18px 0; max-width: 760px; margin-left: auto; margin-right: auto;
}
.hn-rec-panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.hn-rec-chip {
  background: var(--accent); color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 999px; text-transform: uppercase; letter-spacing: 0.4px;
}
.hn-rec-status { font-size: 11.5px; color: var(--gold); font-weight: 700; }
.hn-rec-action { font-size: 15.5px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.hn-rec-rationale { font-size: 13px; color: var(--grey-light); margin-bottom: 10px; line-height: 1.5; }
.hn-rec-disclosure { font-size: 11px; color: var(--grey); font-style: italic; border-top: 1px solid var(--navy-border); padding-top: 8px; }

.hn-signoff-form {
  max-width: 760px; margin: 0 auto; background: var(--navy-card); border: 1px solid var(--navy-border);
  border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;
}
.hn-signoff-form h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); margin: 0; }
.hn-signoff-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--grey-light); font-weight: 700; }
.hn-signoff-form input, .hn-signoff-form select, .hn-signoff-form textarea {
  background: var(--navy-card2); border: 1px solid var(--navy-border); border-radius: 8px; padding: 9px 12px;
  color: #dbe4ee; font-family: var(--font-body); font-size: 13.5px; resize: vertical;
}
.hn-signoff-submit {
  background: var(--accent); color: var(--ink); border: none; border-radius: 8px; padding: 11px 20px;
  font-weight: 700; font-size: 13.5px; cursor: pointer; margin-top: 6px;
}
.hn-signoff-error { background: rgba(255,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
.hn-signoff-complete { border-color: var(--ok); }

.hn-resolved-empty {
  text-align: center; color: var(--grey); font-size: 13px; margin: 80px auto; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hn-resolved-empty-icon { font-size: 40px; margin-bottom: 6px; opacity: 0.6; }
.hn-resolved-empty-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--grey-light); }
.hn-resolved-empty-sub { font-size: 13px; color: var(--grey); line-height: 1.6; }

.hn-queue-empty {
  text-align: center; color: var(--grey); font-size: 13px; margin: 60px auto; max-width: 460px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hn-queue-empty-icon { font-size: 40px; margin-bottom: 6px; }
.hn-queue-empty-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--grey-light); }
.hn-queue-empty-sub { font-size: 13px; color: var(--grey); line-height: 1.6; }
.hn-resolved-list { display: flex; flex-direction: column; gap: 14px; }
.hn-resolved-card { background: var(--navy-card); border: 1px solid var(--navy-border); border-radius: 12px; padding: 18px 20px; }
.hn-resolved-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.hn-resolved-facility { font-weight: 700; color: #fff; font-size: 14px; }
.hn-resolved-divergent { color: var(--gold); font-size: 12px; font-weight: 700; }
.hn-resolved-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px; }
.hn-resolved-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--grey-light); margin-bottom: 4px; }
.hn-resolved-value { font-size: 13px; color: #dbe4ee; line-height: 1.5; }
.hn-resolved-signer { font-size: 11.5px; color: var(--grey); border-top: 1px solid var(--navy-border); padding-top: 8px; }

.hn-footer-challenge { font-size: 10.5px; color: var(--grey); margin-top: 4px; }

@media (max-width: 700px) {
  .hn-resolved-compare { grid-template-columns: 1fr; gap: 12px; }
}

/* ---------- Product Refinement (Day 57) ---------- */

/* Keyboard focus — visible, high-contrast, never removed */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [role="button"]:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Micro-interactions — subtle, not decorative */
.hn-incident-card, .hn-compare-card, .hn-facility-chip, .hn-tab, .hn-pill button,
.hn-signoff-submit, .hn-day-head {
  transition: border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
}
.hn-incident-card:hover, .hn-compare-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
.hn-incident-card:active, .hn-compare-card:active { transform: translateY(0); }
.hn-signoff-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(15,212,190,0.25); }
.hn-signoff-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Theme switching — color transition instead of a hard cut */
body, .hn-header, .hn-nav, .hn-card, .hn-incident-card, .hn-compare-card, .hn-detail-card {
  transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

/* Loading state */
.hn-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 80px 20px; color: var(--grey-light); font-size: 13px;
}
.hn-loading-spinner {
  width: 34px; height: 34px; border-radius: 999px;
  border: 3px solid var(--navy-border); border-top-color: var(--accent);
  animation: hn-spin 0.8s linear infinite;
}
@keyframes hn-spin { to { transform: rotate(360deg); } }

/* Facility compare strip — scroll affordance so horizontal overflow isn't a dead end */
.hn-compare-strip { position: relative; }
.hn-compare-card { cursor: pointer; }
.hn-compare-card[role="button"]:focus-visible { outline-offset: -2px; }

/* Respect reduced-motion preference */
@media (prefers-reduced-motion: reduce) {
  .hn-incident-card, .hn-compare-card, .hn-facility-chip, .hn-tab, .hn-pill button,
  .hn-signoff-submit, .hn-day-head, body, .hn-header, .hn-nav, .hn-card,
  .hn-detail-card, .hn-loading-spinner {
    transition: none !important;
    animation-duration: 0.01ms !important;
  }
}

/* ---------- Responsive ---------- */
@media (max-width: 700px) {
  .hn-header { padding: 12px 14px; }
  .hn-title { font-size: 16px; }
  .hn-nav { padding: 8px 14px; overflow-x: auto; flex-wrap: nowrap; }
  .hn-tab { flex-shrink: 0; padding: 8px 12px; font-size: 12px; }
  .hn-main { padding: 18px 14px 40px; }
  .hn-section-title { font-size: 23px; }
  .hn-card { padding: 15px 15px; }
  .hn-slide { padding: 22px 20px; }
  .hn-slide-title { font-size: 20px; }
  .hn-slide-body { font-size: 12px; }
  .hn-qrow { flex-direction: row; }
  .hn-controls { width: 100%; justify-content: flex-start; }
}

<script>// ---- data/prng.js ----
/**
 * prng.js — mulberry32 seeded pseudo-random number generator.
 *
 * Why a seeded PRNG instead of Math.random(): every screenshot, QA pass, and
 * ?demo=1 walkthrough needs to show the EXACT same synthetic incidents every
 * time. Math.random() can't be reproduced; mulberry32(seed) can.
 *
 * Usage:
 *   const rand = mulberry32(12345);
 *   rand(); // -> deterministic float in [0, 1), same every run for this seed
 */
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Pick a deterministic integer in [min, max] inclusive. */
function randInt(rand, min, max) {
  return Math.floor(rand() * (max - min + 1)) + min;
}

/** Pick a deterministic item from an array. */
function pick(rand, arr) {
  return arr[randInt(rand, 0, arr.length - 1)];
}

/**
 * Resolve today's seed: ?seed=NNN overrides, ?demo=1 forces a fixed
 * well-known seed (so every demo/screenshot session is identical), otherwise
 * a fresh random seed is used per page load.
 */
function resolveSeed() {
  const params = new URLSearchParams(window.location.search);
  const explicitSeed = params.get("seed");
  if (explicitSeed) return parseInt(explicitSeed, 10);
  if (params.get("demo") === "1") return 51260; // fixed demo seed
  return Math.floor(Math.random() * 1e9);
}


// ---- data/schema.js ----
/**
 * schema.js — JSDoc shapes for the HealthNexus in-memory data model.
 * See docs/SCHEMA.md (Day 52) for the full validated design.
 *
 * No real database in v1.0 — these are plain object shapes, not table
 * definitions. Kept here as the single reference every generator and
 * component agrees on.
 */

/**
 * @typedef {Object} Facility
 * @property {string} id
 * @property {string} name              synthetic, never a real institution
 * @property {string} region
 * @property {number} bedCount
 * @property {{mortalityIndex:number, infectionRate:number, avgLOS:number}} baselineKPIs
 */

/**
 * @typedef {"sentinel_event"|"mortality_index"|"infection_rate"} IncidentType
 */

/**
 * @typedef {"Exceptional"|"Strong"|"Moderate"|"Elevated"|"High Risk"} SeverityTier
 */

/**
 * @typedef {Object} Incident
 * @property {string} id
 * @property {string} facilityId
 * @property {string} unit
 * @property {IncidentType} type
 * @property {SeverityTier} severityTier
 * @property {string} narrative
 * @property {string} trendContext
 * @property {string} timestamp          ISO datetime
 * status is NOT a field here — it is derived at read-time from whether a
 * SignOff exists for this incident (see incidentState.js). This is the
 * structural governance gate from PRD F5.
 */

/**
 * @typedef {Object} Recommendation
 * @property {string} incidentId
 * @property {string} recommendedAction
 * @property {string} rationale
 * @property {string} generatedAt        ISO datetime
 * @property {"synthetic_rule_engine"|"claude_api"} source
 */

/**
 * @typedef {"accepted"|"modified"|"rejected"} SignOffDecision
 */

/**
 * @typedef {Object} SignOff
 * @property {string} incidentId
 * @property {string} signerName
 * @property {string} signerRole
 * @property {SignOffDecision} decision
 * @property {string} [decisionNote]     required if decision !== "accepted"
 * @property {string} timestamp          ISO datetime
 */

const SEVERITY_TIERS = ["Exceptional", "Strong", "Moderate", "Elevated", "High Risk"];
const SEVERITY_RANK = { "Exceptional": 0, "Strong": 1, "Moderate": 2, "Elevated": 3, "High Risk": 4 };
const INCIDENT_TYPES = ["sentinel_event", "mortality_index", "infection_rate"];

/**
 * Shared display lookup tables. Defined ONCE here, not per-component, because
 * this bundle has no ES modules at runtime — every file shares one script
 * scope, so duplicate `const TIER_CLASS = {...}` in two component files
 * throws "already declared" the moment they're concatenated. Any component
 * needing these reads them as plain globals (no import needed).
 */
const TIER_CLASS = { "High Risk": "highrisk", "Elevated": "elevated", "Moderate": "moderate", "Strong": "strong", "Exceptional": "exceptional" };
const TIER_LABEL_AR = { "High Risk": "خطر عالٍ", "Elevated": "مرتفع", "Moderate": "متوسط", "Strong": "قوي", "Exceptional": "استثنائي" };
const TYPE_LABEL = {
  sentinel_event: { en: "Sentinel Event", ar: "حدث جسيم" },
  mortality_index: { en: "Mortality Index", ar: "مؤشر الوفيات" },
  infection_rate: { en: "Infection Rate", ar: "معدل العدوى" },
};


// ---- data/generateFacilities.js ----

const FACILITY_NAMES = [
  "Al Marjan Regional Medical Center",
  "Falcon Ridge General Hospital",
  "Coral Bay University Hospital",
  "Sable Peak Medical Center",
  "Harbor Crescent Regional Hospital",
  "Desert Rose Medical City",
];

const REGIONS = ["GCC — Synthetic", "GCC — Synthetic", "US — Synthetic"];

/**
 * Generate 5-6 synthetic facilities. Never a real institution name (PRD §5).
 * @param {() => number} rand
 * @returns {import('./schema.js').Facility[]}
 */
function generateFacilities(rand) {
  const count = randInt(rand, 5, 6);
  const names = [...FACILITY_NAMES].sort(() => rand() - 0.5).slice(0, count);

  return names.map((name, i) => ({
    id: `fac_${String(i + 1).padStart(2, "0")}`,
    name,
    region: pick(rand, REGIONS),
    bedCount: randInt(rand, 80, 650),
    baselineKPIs: {
      mortalityIndex: +(0.6 + rand() * 0.8).toFixed(2),
      infectionRate: +(1.0 + rand() * 3.5).toFixed(2),
      avgLOS: +(3.2 + rand() * 2.8).toFixed(1),
    },
  }));
}


// ---- data/generateIncidents.js ----

const UNITS = ["ICU", "L&D", "Med-Surg", "Emergency", "Oncology", "Cardiac Care"];

const NARRATIVES = {
  sentinel_event: [
    "Wrong-site procedure near-miss caught during pre-op verification.",
    "Unexpected in-unit fall resulting in review-level injury.",
    "Medication administration deviation flagged by pharmacy reconciliation.",
  ],
  mortality_index: [
    "Mortality index for this unit has moved outside expected control limits.",
    "Risk-adjusted mortality trend breach detected across the last reporting cycle.",
    "Unit mortality index flagged during weekly quality review.",
  ],
  infection_rate: [
    "Central-line-associated infection rate trending above facility baseline.",
    "Surgical-site infection cluster identified across three cases this week.",
    "Hand-hygiene compliance drop correlated with rising infection rate.",
  ],
};

const TREND_PHRASES = [
  "up from Moderate 6 hours ago",
  "unchanged for 2 days, under monitoring",
  "escalated from Elevated overnight",
  "first flag this reporting cycle",
];

/**
 * Generate 15-25 synthetic incidents across the given facilities.
 * @param {() => number} rand
 * @param {import('./schema.js').Facility[]} facilities
 * @returns {import('./schema.js').Incident[]}
 */
function generateIncidents(rand, facilities) {
  const count = randInt(rand, 15, 25);
  const incidents = [];

  for (let i = 0; i < count; i++) {
    const type = pick(rand, INCIDENT_TYPES);
    const facility = pick(rand, facilities);
    const hoursAgo = randInt(rand, 1, 96);
    const timestamp = new Date(Date.now() - hoursAgo * 3600 * 1000).toISOString();

    incidents.push({
      id: `inc_${String(i + 1).padStart(4, "0")}`,
      facilityId: facility.id,
      unit: pick(rand, UNITS),
      type,
      severityTier: pick(rand, SEVERITY_TIERS),
      narrative: pick(rand, NARRATIVES[type]),
      trendContext: pick(rand, TREND_PHRASES),
      timestamp,
    });
  }

  return incidents;
}


// ---- data/generateRecommendation.js ----
const ACTIONS = {
  sentinel_event: {
    default: "Convene an immediate root-cause review with unit leadership.",
    "High Risk": "Escalate to the sentinel event response team and notify the Chief Medical Officer.",
  },
  mortality_index: {
    default: "Schedule a mortality-index case review with the quality committee.",
    "High Risk": "Escalate to rapid-response review and notify unit medical director within 2 hours.",
  },
  infection_rate: {
    default: "Initiate an infection-prevention audit for the affected unit.",
    "High Risk": "Escalate to infection control leadership and suspend elective procedures pending review.",
  },
};

const RATIONALES = {
  sentinel_event: "Sentinel events require documented root-cause analysis regardless of outcome severity, per standard governance practice.",
  mortality_index: "A mortality index breach outside control limits warrants case-level review before the next reporting cycle.",
  infection_rate: "Infection rate trends above baseline are addressed early to prevent cluster escalation.",
};

/**
 * Generate exactly one AI-drafted recommendation for an incident.
 * This is a deterministic, rule-based template in v1.0 — not a live model
 * call — so the tool works fully offline and reproducibly (see ARCHITECTURE.md §5).
 * @param {import('./schema.js').Incident} incident
 * @returns {import('./schema.js').Recommendation}
 */
function generateRecommendation(incident) {
  const actionSet = ACTIONS[incident.type];
  const recommendedAction = actionSet[incident.severityTier] || actionSet.default;

  return {
    incidentId: incident.id,
    recommendedAction,
    rationale: RATIONALES[incident.type],
    generatedAt: new Date().toISOString(),
    source: "synthetic_rule_engine",
  };
}


// ---- state/incidentState.js ----

/**
 * incidentState.js — the v1.0 "API" module (see docs/API.md, Day 52).
 *
 * THIS FILE IS THE GOVERNANCE BOUNDARY. `submitSignOff` is the only function
 * in the entire codebase permitted to attach a SignOff to an incident, and an
 * incident's derived status only becomes "resolved" once a SignOff exists.
 * No other function, anywhere, may write a SignOff object. Do not add one.
 */

class NotFoundError extends Error {
  constructor(message) {
    super(message);
    this.name = "NotFoundError";
  }
}
class AlreadySignedOffError extends Error {
  constructor(message) {
    super(message);
    this.name = "AlreadySignedOffError";
  }
}
class ValidationError extends Error {
  constructor(message) {
    super(message);
    this.name = "ValidationError";
  }
}

let _facilities = [];
let _incidents = [];
let _recommendations = new Map(); // incidentId -> Recommendation
let _signOffs = new Map(); // incidentId -> SignOff
let _seed = null;

/** Initialize (or reinitialize) the whole in-memory dataset from a seed. */
function initState(seed = resolveSeed()) {
  _seed = seed;
  const rand = mulberry32(seed);
  _facilities = generateFacilities(rand);
  _incidents = generateIncidents(rand, _facilities);
  _recommendations = new Map(_incidents.map((inc) => [inc.id, generateRecommendation(inc)]));
  _signOffs = new Map();
  return { seed: _seed, facilityCount: _facilities.length, incidentCount: _incidents.length };
}

function deriveStatus(incidentId) {
  return _signOffs.has(incidentId) ? "resolved" : "open";
}

function withFacilityName(incident) {
  const facility = _facilities.find((f) => f.id === incident.facilityId);
  return { ...incident, facilityName: facility ? facility.name : "Unknown Facility", status: deriveStatus(incident.id) };
}

/** getIncidentQueue(filters?) — see docs/API.md */
function getIncidentQueue(filters = {}) {
  let list = _incidents.filter((inc) => deriveStatus(inc.id) === "open");
  if (filters.facilityId) {
    const exists = _facilities.some((f) => f.id === filters.facilityId);
    if (!exists) {
      console.warn(`getIncidentQueue: unknown facilityId "${filters.facilityId}", returning unfiltered queue`);
    } else {
      list = list.filter((inc) => inc.facilityId === filters.facilityId);
    }
  }
  return list
    .map(withFacilityName)
    .sort((a, b) => SEVERITY_RANK[b.severityTier] - SEVERITY_RANK[a.severityTier] || new Date(b.timestamp) - new Date(a.timestamp));
}

/** getIncidentDetail(incidentId) — see docs/API.md */
function getIncidentDetail(incidentId) {
  const incident = _incidents.find((inc) => inc.id === incidentId);
  if (!incident) throw new NotFoundError(`No incident with id ${incidentId}`);
  const facility = _facilities.find((f) => f.id === incident.facilityId);
  return {
    incident: withFacilityName(incident),
    facility,
    recommendation: _recommendations.get(incidentId) || null,
    signOff: _signOffs.get(incidentId) || null,
  };
}

/** getFacilitySummary() — see docs/API.md */
function getFacilitySummary() {
  return _facilities.map((f) => {
    const open = _incidents.filter((inc) => inc.facilityId === f.id && deriveStatus(inc.id) === "open");
    const worstTier = open.reduce((worst, inc) => {
      if (!worst) return inc.severityTier;
      return SEVERITY_RANK[inc.severityTier] > SEVERITY_RANK[worst] ? inc.severityTier : worst;
